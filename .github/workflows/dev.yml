name: Deploy to Test

# Builds website/ and publishes it as a free preview on the test site, at
# https://<branch>--husetmotell-test.netlify.app, with every page noindex. The steps are in deploy.yml.
# To preview another branch: Actions → Deploy to Test → Run workflow, and pick the branch.
on:
  push:
    branches:
      - test
      - michaelsimsoe-huset-site-remake
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two quick saves in the CMS queue up rather than racing each other to Netlify.
concurrency:
  group: deploy-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      production: false
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.DEV_NETLIFY_SITE_ID }}
