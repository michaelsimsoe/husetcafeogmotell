# Pages CMS (https://pagescms.org): the editing screens for the new website in website/.
# One screen per job the owners do, most frequent first. Each screen edits one file in
# website/src/content/, and each field here matches website/src/data/schema.ts. The build checks
# every save, so a broken value stops the deploy with a Norwegian error message instead of reaching
# the live site, and GitHub Actions opens an issue quoting it (.github/workflows/dev.yml).

settings:
  content:
    # Keep keys this file doesn't describe instead of dropping them on save.
    merge: true
  commit:
    templates:
      update: "Innhold: oppdaterte {filename} (via Pages CMS)"

content:
  - name: menu
    label: Menyen
    type: file
    path: website/src/content/menu.json
    format: json
    fields:
      - name: confirmed
        label: Menyen er bekreftet
        type: boolean
        description: Når denne er av, viser nettsiden at priser og allergener skal bekreftes.
      - { name: note, label: Merknad øverst, type: text }
      - { name: allergenNote, label: Merknad om allergener, type: text }
      - name: allergens
        label: Allergener
        description: Nummeret brukes i rettene under. Ikke endre et nummer som er i bruk. Rettene kan velge allergen 1–5; trengs flere, må nettsiden oppdateres.
        type: object
        list:
          min: 1
          collapsible: { collapsed: true, summary: "{code} {name}" }
        fields:
          - { name: code, label: Nummer, type: string, required: true, pattern: { regex: "^\\d+$", message: Allergenkoden må være et tall. } }
          - { name: name, label: Navn, type: string, required: true }
      - name: sections
        label: Deler av menyen
        type: object
        list:
          min: 1
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: title, label: Overskrift, type: string, required: true }
          - name: id
            label: Lenkenavn
            type: string
            required: true
            description: Brukes i lenken til denne delen, for eksempel /meny#pizza. Bare små bokstaver a–z, tall og bindestrek.
            pattern:
              regex: "^[a-z0-9-]+$"
              message: Bare små bokstaver a–z, tall og bindestrek.
          - { name: note, label: Merknad, type: text }
          - name: dishes
            label: Retter
            type: object
            list:
              min: 1
              collapsible: { collapsed: true, summary: "{name}" }
            fields:
              - { name: name, label: Navn, type: string, required: true }
              - { name: description, label: Beskrivelse, type: string }
              - name: price
                label: "Pris (kr)"
                type: number
                description: La stå tom hvis retten har varianter med egen pris.
                options: { min: 0 }
              - name: variants
                label: Varianter
                description: For eksempel størrelser. Hver variant har sin egen pris.
                type: object
                list: true
                fields:
                  - { name: label, label: Variant, type: string, required: true }
                  - { name: price, label: "Pris (kr)", type: number, required: true, options: { min: 0 } }
              - name: allergens
                label: Allergener
                type: select
                options:
                  multiple: true
                  values:
                    - { name: "1", label: "1 Gluten" }
                    - { name: "2", label: "2 Laktose" }
                    - { name: "3", label: "3 Egg" }
                    - { name: "4", label: "4 Sennep" }
                    - { name: "5", label: "5 Nøtter" }
              - name: featured
                label: Vis på forsiden
                type: boolean
                description: Forsiden viser de fremhevede rettene fra de to første delene av menyen som har noen.
              - name: unavailable
                label: Ikke tilgjengelig nå
                type: boolean
                description: Skjuler retten på nettsiden til du slår av bryteren igjen. Er alle rettene i en del skjult, forsvinner hele delen.

  - name: hours
    label: Åpningstider
    type: file
    path: website/src/content/hours.json
    format: json
    fields:
      - { name: confirmed, label: Tidene er bekreftet, type: boolean, description: "Når denne er av, viser nettsiden at tidene skal bekreftes." }
      - { name: monday, label: Mandag, component: day, description: "Skriv klokkeslett som TT:MM, for eksempel 09:30. Dager med like tider slås sammen på nettsiden." }
      - { name: tuesday, label: Tirsdag, component: day }
      - { name: wednesday, label: Onsdag, component: day }
      - { name: thursday, label: Torsdag, component: day }
      - { name: friday, label: Fredag, component: day }
      - { name: saturday, label: Lørdag, component: day }
      - { name: sunday, label: Søndag, component: day, description: "Endrer dere tidene, husk å endre dem på Google og Facebook også." }

  - name: notice
    label: Beskjed på nettsiden
    type: file
    path: website/src/content/notice.json
    format: json
    fields:
      - name: show
        label: Vis beskjeden
        type: boolean
        description: Beskjeden vises øverst på alle sidene, for eksempel når kjøkkenet stenger tidligere en dag.
      - name: text
        label: Beskjed
        type: string
        description: Én eller to korte setninger, under 200 tegn.
        options: { maxlength: 200 }
      - name: textEn
        label: Beskjed på engelsk (valgfritt)
        type: string
        description: Vises på de engelske sidene. La stå tom, så vises den norske beskjeden der også.
        options: { maxlength: 200 }
      - name: until
        label: Vis til og med
        type: date
        default: ""
        description: Siste dag beskjeden vises. Dagen etter forsvinner den av seg selv. La stå tom for å vise den til du slår den av.
        options: { format: yyyy-MM-dd }

  - name: rooms
    label: Rom og priser
    type: file
    path: website/src/content/rooms.json
    format: json
    fields:
      - { name: confirmed, label: Opplysningene er bekreftet, type: boolean }
      - { name: count, label: Antall rom, type: number, required: true, options: { min: 1 } }
      - { name: priceFrom, label: "Pris fra (kr per natt)", type: number, required: true, options: { min: 0 } }
      - { name: checkIn, label: Innsjekk fra, component: time }
      - { name: checkOut, label: Utsjekk innen, component: time }

  - name: venues
    label: Selskap og møterom
    type: file
    path: website/src/content/venues.json
    format: json
    fields:
      - { name: confirmed, label: Opplysningene er bekreftet, type: boolean }
      - { name: capacity, label: Antall gjester (inntil), type: number, required: true, options: { min: 1 } }
      - { name: cakes, label: Kaker, type: string, description: "La stå tom hvis dere ikke tar imot kakebestillinger." }
      - name: extras
        label: Annet dere tilbyr
        description: Vises under menyutdraget på forsiden, for eksempel «Uteservering».
        type: string
        list: true
      - name: meetingRooms
        label: Møterom
        type: object
        fields:
          - { name: confirmed, label: Opplysningene er bekreftet, type: boolean }
          - name: rooms
            label: Rom
            type: object
            list:
              collapsible: { collapsed: true, summary: "{name}" }
            fields:
              - { name: name, label: Navn, type: string, required: true }
              - { name: equipment, label: Utstyr, type: string }
              - { name: price, label: "Pris (kr)", type: number, options: { min: 0 } }

  - name: contact
    label: Kontakt og lenker
    type: file
    path: website/src/content/contact.json
    format: json
    fields:
      - name: phone
        label: Telefon
        type: string
        required: true
        description: Skriv nummeret slik det skal vises, for eksempel 403 17 353.
        pattern:
          regex: "^\\+?[\\d ]{8,16}$"
          message: Telefonnummeret kan bare ha siffer og mellomrom.
      - name: email
        label: E-post
        type: string
        required: true
      - name: facebook
        label: Facebook-side
        type: string
        required: true

components:
  day:
    type: object
    fields:
      - { name: closed, label: Stengt, type: boolean }
      - name: open
        label: Åpner
        type: string
        required: true
        pattern: { regex: "^([01]\\d|2[0-3]):[0-5]\\d$", message: "Bruk formatet TT:MM, for eksempel 09:30." }
      - name: close
        label: Stenger
        type: string
        required: true
        pattern: { regex: "^([01]\\d|2[0-3]):[0-5]\\d$", message: "Bruk formatet TT:MM, for eksempel 09:30." }
  time:
    type: string
    required: true
    pattern:
      regex: "^([01]\\d|2[0-3]):[0-5]\\d$"
      message: Bruk formatet TT:MM, for eksempel 09:30.
